# Ruff configuration for the Generative-CD project.
# Only configures the ruff formatter/linter — does NOT turn the repo into an
# installable package (no [build-system]/[project] table on purpose).

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["GNCDM/result", "GNCDM/incremental_result", "GNCDM/math1_result"]

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import sorting, UP = pyupgrade.
select = ["E", "F", "I", "UP"]
# E501 (line too long) is handled by the formatter; F401 unused-import in
# __init__.py is intentional re-exports.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
